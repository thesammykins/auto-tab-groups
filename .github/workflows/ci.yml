name: Fork CI and preview packages

on:
  push:
    branches: [feat/dia-linked-tab-groups]
    paths-ignore: ["**/*.md", "docs/**", "images/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "images/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, format and typecheck
        run: bun run code:check

      - name: Unit tests
        run: bun run test

      - name: Build Chrome
        run: bun run build:chrome

      - name: Build Firefox
        run: bun run build:firefox

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Browser tests
        run: xvfb-run --auto-servernum -- bunx playwright test --fail-on-flaky-tests

      # Reuse the tested builds; wxt zip would build them a second time.
      - name: Package unpacked previews
        run: python3 scripts/package_preview.py

      - name: Upload preview packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unpacked-extension-previews
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
